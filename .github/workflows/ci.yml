name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck (library, tests and examples)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests, including the 16,384-case exhaustive test
        run: npm test
      - name: Guard proxy in front of an unchanged third-party server (SmartLock Co)
        run: npm run demo
      - name: Package contents
        run: npm pack --dry-run
